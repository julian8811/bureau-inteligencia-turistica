# Lo que corre orchestration/daily.py. Actualizado 2026-11-02.
# Fuera del daily (0 filas, duplicadas o sin módulo en el repo):
#   un_wb_arrivals, wb_receipts, wb_departures (sin dato después de 2020; OWID los cubre)
#   airportmiles_mde, emisores_contexto, tieredtravel_med (0 filas)
#   opensky_mde, ticketmaster_eventos, opentripmap_med, aerodatabox (sin módulo o exigen key)
#   gated_amadeus, gated_brand24, gated_flightpowers (borrados; exigen contrato)
#   socrata_migrantes c4mm-qn8q (el recurso responde filas vacías)
daily:
  - google_trends
  - socrata_co
  - socrata_operaciones # jh8x-n6h6, agregado mensual SKRG/SKMD
  - dane_egit
  - dane_ema            # anex-EMA-{mes}{año}.xlsx
  - dane_ipc            # índice nacional; el anexo por ciudad es .xls
  - gdelt_marca         # GKG de 15 min, no el DOC API (429)
  - alerts_rss
  - eurostat_tourism
  - eurostat_aviation
  - eurostat_arrivals
  - trm_co              # TRM oficial 32sa-8pi3; ER-API solo si Socrata falla
  - festivos_co         # Colombia + festivos_emisores (US MX BR ES PA FR DO)
  - avisos_viaje        # US State, Canadá, FCDO
  - wikimedia_views
  - prensa_rss
  - rnt_prestadores
  - seguridad_med
  - metro_movilidad
  - ideam_clima
  - sisaire_amva        # PM2.5 medido AMVA, g4t8-zkc3
  - gastronomia_nocturna
  - eurostat_capacity
  - eurostat_demanda    # solo tour_dem_ttmd (ttot y toac dan 404)
  - terminales_med
  - rnt_antioquia
  - aerocivil_flota
  - aire_med
  - bts_colombia        # T-100 EE. UU.–Colombia, no por aeropuerto
  - fx_cop              # EUR/MXN/BRL; el COP oficial va por trm_co
  - openmeteo_ensemble
  # opcionales fuera del diario (nadie los lee: ni KPIs ni dashboard):
  # - openmeteo_med      # clima 7d+30d (re-cablear solo si un KPI lo usa)
  # - conectividad_aerea # snapshot estatico (re-cablear como mensual)
  # - tiktok_trends    # manual: exportar Top Ads/Trends 1x semana
  # - meta_ads         # manual: Meta Ad Library 1x semana

alert_rss_feeds: []    # pegar URLs RSS aquí o en extract/alerts_rss.py ALERT_FEEDS

# Gated: NO se scrapean. Carga manual o API con key. El daily los salta si no hay key/archivo.
gated_manual:
  - globaldata_store    # data/raw/manual/*.xlsx comprado
  - amadeus_feed        # solo con contrato -> data/raw/manual/
  - amadeus_dev         # env AMADEUS_KEY (developers.amadeus.com)
  - brand24             # env BRAND24_KEY o CSV trial en manual/
  - flightpowers        # env FLIGHTPOWERS_KEY (RapidAPI, BASIC 10/mes)
  - aerodatabox           # misma RapidAPI key (estado MDE/EOH en vivo)
  - icca_cvent          # rankings anuales + RFP CRM interno
  - crm_interno         # data/raw/manual/crm.xlsx (RFP/eventos/miembros/Wompi)
  - situr               # SITUR Antioquia: portal caído hoy -> carga manual mensual hasta tener endpoint
