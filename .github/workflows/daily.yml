# Monorepo T5: ETL vive en apps/etl, front en apps/tableros.
# Vercel: Root Directory del proyecto = apps/tableros (setting del dashboard,
# no se versiona). Hasta el cutover, el daily sigue publicando al repo viejo
# tableros-bureau vía PUBLISH_TAB_URL para no romper tableros-bureau.vercel.app.
# FRAGIL: TABLEROS_PAT con push cruzado a DOS repos (BIT+TAB). Si el PAT rota
# o caduca, mueren ambos publishes (ver apps/etl/export/publicar.py).
# Migración: cuando Vercel lea este repo, el push TAB se apaga y el push BIT
# pasa a github.token (mismo repo, sin PAT). Nombres de secrets intactos a
# propósito; ningún valor tocado.
name: daily-bureau
on:
  schedule:
    - cron: "0 13 * * *"  # 08:00 America/Bogota (Colombia no tiene DST)
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BACKEND_DATABASE_URL: ${{ secrets.BACKEND_DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ secrets.TABLEROS_PAT }}
      PUBLISH_CACHE_DIR: /tmp/bureau-publish
      PUBLISH_BIT_URL: https://x-access-token:${{ secrets.TABLEROS_PAT }}@github.com/julian8811/bureau-inteligencia-turistica.git
      PUBLISH_TAB_URL: https://x-access-token:${{ secrets.TABLEROS_PAT }}@github.com/julian8811/tableros-bureau.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/etl/requirements.txt
      - run: pip install -r apps/etl/requirements.txt
      - run: python -m playwright install chromium --with-deps
      - name: daily ETL
        run: python apps/etl/orchestration/daily.py
      - name: avisar si fallo
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo ${{ github.repository }} \
            --title "[daily] falló $(date -u +%F)" \
            --body "Corrida ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Revisar log y reintentar con workflow_dispatch." || true
      - name: commit data generada
        run: |
          git config user.name bureau-etl
          git config user.email bureau-etl@local
          git add apps/etl/data/processed apps/etl/export apps/etl/web/data apps/etl/informes 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data(etl): daily $(date -u +%F)"
          git push origin HEAD:main || echo "sin cambios para pushear"
      - name: subir PDFs del informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pdfs
          path: apps/etl/informes/*.pdf
          retention-days: 30
          if-no-files-found: warn
      - name: subir informe JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-json
          path: |
            apps/etl/export/informe_llm/*.json
            apps/etl/export/tableros_bureau/informe_llm.json
            apps/etl/web/data/informe_llm.json
          retention-days: 30
          if-no-files-found: warn
