name: daily-bureau
on:
  schedule:
    - cron: "0 11 * * *"  # 06:00 America/Bogota
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BACKEND_DATABASE_URL: ${{ secrets.BACKEND_DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ secrets.TABLEROS_PAT }}
      PUBLISH_CACHE_DIR: /tmp/bureau-publish
      PUBLISH_BIT_URL: https://x-access-token:${{ secrets.TABLEROS_PAT }}@github.com/julian8811/bureau-inteligencia-turistica.git
      PUBLISH_TAB_URL: https://x-access-token:${{ secrets.TABLEROS_PAT }}@github.com/julian8811/tableros-bureau.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl-bureau/requirements.txt
      - run: pip install -r etl-bureau/requirements.txt
      - run: python -m playwright install chromium --with-deps
      - name: daily ETL
        run: python etl-bureau/orchestration/daily.py
      - name: commit data generada
        run: |
          git config user.name bureau-etl
          git config user.email bureau-etl@local
          git add etl-bureau/data/processed etl-bureau/export etl-bureau/web/data etl-bureau/informes 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data(etl): daily $(date -u +%F)"
          git push origin HEAD:main || echo "sin cambios para pushear"
